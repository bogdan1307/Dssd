name: Build BatNoShutdown APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/local/batnoshutdown app/src/main/assets app/src/main/res/values
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.local.batnoshutdown">
              <application android:label="BatNoShutdown">
                  <meta-data android:name="xposedmodule" android:value="true"/>
                  <meta-data android:name="xposeddescription" android:value="No shutdown at 0 percent"/>
                  <meta-data android:name="xposedminversion" android:value="82"/>
              </application>
          </manifest>
          EOF

          echo "com.local.batnoshutdown.Hook" > app/src/main/assets/xposed_init

          cat > app/src/main/java/com/local/batnoshutdown/Hook.java << 'EOF'
          package com.local.batnoshutdown;
          import java.lang.reflect.Method;
          import de.robv.android.xposed.*;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
            public void handleLoadPackage(XC_LoadPackage.LoadPackageParam p) {
              if (!"android".equals(p.packageName)) return;
              try {
                Class<?> c = XposedHelpers.findClass("com.android.server.BatteryService", p.classLoader);
                int n = 0;
                for (Method m : c.getDeclaredMethods()) {
                  if (m.getName().startsWith("shutdownIfNoPower") && m.getReturnType() == void.class) {
                    XposedBridge.hookMethod(m, XC_MethodReplacement.DO_NOTHING);
                    XposedBridge.log("BatNoShutdown: hooked " + m);
                    n++;
                  }
                }
                if (n == 0) XposedBridge.log("BatNoShutdown: NO shutdownIfNoPower* method found");
              } catch (Throwable t) {
                XposedBridge.log("BatNoShutdown: error " + t);
              }
            }
          }
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url 'https://api.xposed.info/' } }
          }
          EOF

          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.local.batnoshutdown'
              compileSdk 34
              defaultConfig {
                  applicationId "com.local.batnoshutdown"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatNoShutdown-APK
          path: app/build/outputs/apk/debug/app-debug.apk

          
